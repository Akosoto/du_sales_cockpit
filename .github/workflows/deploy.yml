name: Deploy to GitHub Pages

# Switches Pages from the old "deploy from branch" mode (direct static
# serve, no build step — the mode that shipped a repo missing the
# gitignored config.js and broke login on the live site) to an Actions
# build that injects config.js from a repository secret before deploying.
# One-time setup required in the GitHub UI, see the PR/commit description.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write config.js from repository secret
        env:
          CONFIG_JS: ${{ secrets.CONFIG_JS }}
        run: |
          if [ -z "$CONFIG_JS" ]; then
            echo "::error::CONFIG_JS repository secret is not set — see config.example.js for the template to paste as the secret's value."
            exit 1
          fi
          printf '%s\n' "$CONFIG_JS" > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
