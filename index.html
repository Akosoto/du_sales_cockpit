<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>du Business · Sales Cockpit</title>
<style>
/* ── TOKENS ─────────────────────────────────────── */
:root {
  --bg0:#08081a;--bg1:#0f0f28;--bg2:#161634;--bg3:#1e1e42;
  --border:#2a2a52;--border2:#363660;
  --t1:#e8e8f4;--t2:#9090b4;--t3:#5050780;
  --purple:#7c3aed;--purple2:#a78bfa;--purple3:#4c1d95;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --r:8px;--r2:12px;--sh:0 8px 32px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:var(--bg0);color:var(--t1);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:var(--purple2);text-decoration:none}a:hover{text-decoration:underline}

/* ── BUTTONS ─────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover:not(:disabled){background:#6d28d9}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover:not(:disabled){background:#dc2626}
.btn-success{background:var(--green);color:#fff}.btn-success:hover:not(:disabled){background:#059669}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--border)}.btn-ghost:hover:not(:disabled){border-color:var(--purple2);color:var(--purple2)}
.btn-sm{padding:5px 12px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px}
.btn-full{width:100%;justify-content:center}

/* ── FORMS ─────────────────────────────────────── */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--t1);font-size:13px;font-family:inherit}
.field input:focus,.field select,.field textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.field input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.field select:focus{outline:none;border-color:var(--purple)}
.field textarea{resize:vertical;min-height:72px}
.field input[disabled]{opacity:.5;cursor:not-allowed}
.field .hint{font-size:11px;color:var(--t2);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.err{color:var(--red);font-size:12px;margin-top:6px;min-height:18px}

/* ── LOGIN ─────────────────────────────────────── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,rgba(124,58,237,.18) 0%,transparent 60%),var(--bg0)}
.login-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:40px;width:360px;box-shadow:var(--sh)}
.login-brand{text-align:center;margin-bottom:32px}
.du-mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;font-size:1.5rem;font-weight:900;letter-spacing:-2px;margin-bottom:14px;box-shadow:0 4px 20px rgba(124,58,237,.4)}
.login-brand h1{font-size:1.3rem;font-weight:700;color:var(--t1)}
.login-brand p{font-size:11px;color:var(--t2);margin-top:4px}

/* ── APP SHELL ─────────────────────────────────── */
#app{display:flex;flex-direction:column;min-height:100vh}
header{height:52px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:10px}
.du-sm{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;font-size:.8rem;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
.hdr-title{font-weight:600;font-size:.9rem;color:var(--t1)}
.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-name{font-size:13px;color:var(--t2)}

/* ROLE BADGE */
.role-pill{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 9px;border-radius:20px;text-transform:uppercase}
.role-pill.manager{background:rgba(124,58,237,.25);color:#c4b5fd}
.role-pill.team_lead{background:rgba(59,130,246,.25);color:#93c5fd}
.role-pill.agent{background:rgba(16,185,129,.25);color:#6ee7b7}

/* ── NAV ─────────────────────────────────────── */
nav{background:var(--bg1);border-bottom:1px solid var(--border);display:flex;padding:0 16px;overflow-x:auto;flex-shrink:0}
.tab-btn{padding:13px 16px;font-size:13px;font-weight:500;color:var(--t2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab-btn:hover{color:var(--t1)}
.tab-btn.active{color:var(--purple2);border-bottom-color:var(--purple)}

/* ── MAIN CONTENT ─────────────────────────────── */
main{padding:24px;flex:1;max-width:1400px;width:100%;margin:0 auto}

/* ── CARDS ─────────────────────────────────────── */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:16px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-weight:600;font-size:.95rem}

/* ── STATS ─────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;text-align:center}
.stat-val{font-size:1.9rem;font-weight:700;color:var(--purple2);line-height:1}
.stat-lbl{font-size:11px;color:var(--t2);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}

/* ── TABLES ─────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:9px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);border-bottom:1px solid var(--border);background:var(--bg2)}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;color:var(--t1)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.td-company{font-weight:600}
.td-dim{color:var(--t2)}

/* ── STAGE PILLS ─────────────────────────────────── */
.sp{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.sp-new{background:rgba(59,130,246,.2);color:#93c5fd}
.sp-contacted{background:rgba(245,158,11,.2);color:#fcd34d}
.sp-interested{background:rgba(124,58,237,.2);color:#c4b5fd}
.sp-proposal{background:rgba(168,85,247,.3);color:#e9d5ff}
.sp-won{background:rgba(16,185,129,.25);color:#34d399}
.sp-lost{background:rgba(239,68,68,.2);color:#fca5a5}

/* ── PAGE HEADER ─────────────────────────────────── */
.pg-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.pg-hdr h2{font-size:1.15rem;font-weight:700}
.pg-hdr-sub{font-size:12px;color:var(--t2);margin-top:2px}
.pg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── FILTERS ─────────────────────────────────────── */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:5px 12px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--t2);cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:var(--purple2);color:var(--purple2)}
.filter-btn.active{background:var(--purple);border-color:var(--purple);color:#fff}
.filter-count{font-size:11px;opacity:.7}

/* ── SEARCH ─────────────────────────────────────── */
.search-input{padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--t1);font-size:13px;width:220px}
.search-input:focus{outline:none;border-color:var(--purple)}

/* ── EMPTY STATE ─────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--t2)}
.empty-icon{font-size:2.4rem;margin-bottom:12px}
.empty-title{font-size:.95rem;font-weight:600;color:var(--t1);margin-bottom:6px}
.empty-sub{font-size:12px;color:var(--t2)}

/* ── SEED BANNER ─────────────────────────────────── */
.seed-banner{background:rgba(124,58,237,.12);border:1px dashed var(--purple);border-radius:var(--r2);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seed-banner p{font-size:13px;color:var(--t2)}
.seed-banner strong{color:var(--purple2)}

/* ── MODAL ─────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.m-box{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh)}
.m-box.wide{max-width:700px}
.m-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.m-hdr h3{font-size:.95rem;font-weight:600}
.m-close{background:none;border:none;color:var(--t2);cursor:pointer;font-size:15px;padding:3px 7px;border-radius:5px}
.m-close:hover{background:var(--bg3);color:var(--t1)}
.m-body{padding:20px;overflow-y:auto;flex:1}
.m-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px}

/* ── TOAST ─────────────────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;z-index:2000;padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:var(--sh);pointer-events:none;opacity:0;transform:translateY(16px);transition:all .25s}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--green);color:#fff}
#toast.err{background:var(--red);color:#fff}
#toast.info{background:var(--blue);color:#fff}

/* ── LOADING ─────────────────────────────────────── */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--t2)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

/* ── UTILS ─────────────────────────────────────── */
.flex{display:flex;align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-dim{color:var(--t2)}.text-mute{color:var(--t2)}.text-ok{color:var(--green)}.text-err{color:var(--red)}
.divider{height:1px;background:var(--border);margin:14px 0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-item .lbl{font-size:11px;color:var(--t2);margin-bottom:3px}
.info-item .val{font-size:13px;color:var(--t1)}
.locked-note{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:var(--r);padding:10px 13px;font-size:12px;color:#fcd34d;margin-top:12px}

/* ── RESPONSIVE ─────────────────────────────────── */
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}main{padding:14px}.search-input{width:160px}}

/* ── SCRIPTS ─────────────────────────────────────── */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.sc-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:10px}
.sc-card.pending-mine{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.05)}
.sc-card.has-pending{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.05)}
.sc-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.sc-ch-wa{background:rgba(37,211,102,.18);color:#25d366}
.sc-ch-li{background:rgba(0,119,181,.2);color:#7ec8e3}
.sc-ch-em{background:rgba(59,130,246,.18);color:#93c5fd}
.sc-ch-cc{background:rgba(245,158,11,.18);color:#fcd34d}
.sc-ch-def{background:rgba(124,58,237,.18);color:#c4b5fd}
.sc-scope-global{background:rgba(16,185,129,.15);color:#34d399}
.sc-scope-team{background:rgba(168,85,247,.15);color:#e9d5ff}
.sc-body{font-size:12.5px;color:var(--t1);white-space:pre-wrap;line-height:1.55;max-height:90px;overflow:hidden;position:relative}
.sc-body:not(.expanded)::after{content:'';position:absolute;bottom:0;left:0;right:0;height:32px;background:linear-gradient(transparent,#0f0f28)}
.sc-body.expanded{max-height:none}
.sc-meta{font-size:11px;color:var(--t2);line-height:1.5}
.sc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sc-pending-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;color:#f59e0b;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35)}
.ch-tag{display:inline-flex;align-items:center;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--t2);transition:all .15s}
.ch-tag:hover{border-color:var(--purple2);color:var(--purple2)}
.ch-tag.active{background:var(--purple);border-color:var(--purple);color:#fff}
.approval-queue{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.25);border-radius:var(--r2);padding:16px;margin-bottom:20px}
.approval-queue-hdr{margin-bottom:12px}
.approval-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.approval-item:last-child{margin-bottom:0}

/* ── PRODUCTS ─────────────────────────────────── */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:20px}
.pr-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:10px}
.pr-cat{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.pr-cat-starter{background:rgba(59,130,246,.18);color:#93c5fd}
.pr-cat-essential{background:rgba(16,185,129,.18);color:#34d399}
.pr-cat-ultimate{background:rgba(124,58,237,.18);color:#c4b5fd}
.pr-cat-mobile{background:rgba(245,158,11,.18);color:#fcd34d}
.pr-price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr-price-term{font-size:11px;color:var(--t2)}
.pr-price-orig{font-size:12px;color:var(--t2);text-decoration:line-through}
.pr-price-now{font-size:1.05rem;font-weight:700;color:var(--purple2)}
.pr-sub-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pr-sub-discount{color:#34d399;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35)}
.pr-sub-waiver{color:#93c5fd;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35)}
.pr-sub-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.pr-sub-row:last-child{margin-bottom:0}

/* ── MULTI-SELECT DROPDOWN ───────────────────────── */
.ms-wrap{position:relative;display:inline-block}
.ms-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .15s}
.ms-btn:hover{border-color:var(--purple2);color:var(--t1)}
.ms-btn.has-sel{border-color:var(--purple);color:var(--purple2);background:rgba(124,58,237,.08)}
.ms-dd{position:absolute;top:calc(100% + 4px);left:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);min-width:190px;z-index:300;max-height:230px;overflow-y:auto;box-shadow:var(--sh);display:none}
.ms-dd.open{display:block}
.ms-item{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--t1);user-select:none}
.ms-item:hover{background:var(--bg3)}
.ms-item input[type=checkbox]{accent-color:var(--purple);width:13px;height:13px;flex-shrink:0;cursor:pointer}
.adv-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:9px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r)}
.adv-filters-lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;white-space:nowrap}

/* ── PERFORMANCE ACCORDION ───────────────────────── */
.perf-section{border-top:1px solid var(--border);padding:14px 0 4px}
.perf-stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:4px}
.perf-stat .pv{font-size:1.15rem;font-weight:700;line-height:1.2}
.perf-stat .pl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.perf-inline{background:var(--bg2);border-radius:var(--r);padding:10px 14px}
.perf-inline .perf-stat-row{gap:16px}
.perf-inline .pv{font-size:1rem}

/* ── DASHBOARD ───────────────────────────────── */
.stat-target{font-size:10px;color:var(--t2);margin-top:3px}
.fu-group-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px 0 5px;color:var(--t2)}
.fu-hdr-overdue{color:var(--red)}
.fu-hdr-today{color:var(--amber)}
.fu-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.fu-overdue{background:rgba(239,68,68,.15);color:var(--red)}
.fu-today{background:rgba(245,158,11,.15);color:var(--amber)}
.fu-week{background:rgba(59,130,246,.15);color:#93c5fd}
.fu-row{cursor:pointer}
.fu-row:hover td{background:rgba(255,255,255,.04)!important}
.act-log{display:flex;flex-direction:column}
.act-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.act-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:5px}
.act-content{flex:1;min-width:0}
.act-who{font-weight:600;font-size:13px}
.act-change{font-size:13px;color:var(--t2)}
.act-company{font-size:13px;color:var(--purple2)}
.act-time{font-size:11px;color:var(--t2);margin-top:2px}
.prog-bar-wrap{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:6px}
.prog-bar{height:100%;border-radius:4px;transition:width .4s}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.kpi-val{font-size:1.65rem;font-weight:700;line-height:1.1}
.kpi-lbl{font-size:11px;color:var(--t2);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.section-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
</style>
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="du-mark">du</div>
      <h1>Sales Cockpit</h1>
      
    </div>
    <div class="field"><label>Email</label><input type="email" id="li-email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field">
  <label>Password</label>
  <div style="position:relative">

async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const pw    = document.getElementById('li-pw').value;
  const err   = document.getElementById('li-err');
  const btn   = document.getElementById('li-btn');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    let m = 'Login failed. Check your email and password.';
    if(['auth/wrong-password','auth/user-not-found','auth/invalid-credential'].includes(e.code)) m = 'Incorrect email or password.';
    if(e.code === 'auth/too-many-requests') m = 'Too many attempts. Try again in a few minutes.';
    err.textContent = m; btn.disabled = false; btn.textContent = 'Sign In';
  }
}
document.getElementById('li-btn').onclick = doLogin;
document.getElementById('li-pw').onkeydown = e => { if(e.key==='Enter') doLogin(); };

// ════════════════════════════════════════════════════
// ENSURE FIRESTORE USER PROFILE ON FIRST LOGIN
// ════════════════════════════════════════════════════
async function ensureProfile(fbUser){
  const ref  = doc(db, 'users', fbUser.uid);
  const snap = await getDoc(ref);
  if(snap.exists()) return { id: fbUser.uid, ...snap.data() };

  const seed = SEED_EMAILS[(fbUser.email||'').toLowerCase()];
  if(!seed) return null;

  const data = {
    name: seed.name, email: fbUser.email, role: seed.role,
    teamId: null, monthlyTarget: 0, targetSource: 'manager',
    active: true, createdBy: 'system', createdAt: now()
  };
  await setDoc(ref, data);
  return { id: fbUser.uid, ...data };
}

// ════════════════════════════════════════════════════
// AUTH STATE → ROUTING
// ════════════════════════════════════════════════════
onAuthStateChanged(auth, async fbUser => {
  if(fbUser){
    CU = fbUser;
    const p = await ensureProfile(fbUser);
    if(!p){
      await signOut(auth);
      document.getElementById('li-err').textContent = 'Account not set up. Contact your manager.';
      showLogin(); return;
    }
    CP = p;
    showApp();
  } else {
    CU = null; CP = null; showLogin();
  }
});

  document.getElementById('li-btn').textContent = 'Sign In';

}

    if(!cur||!nw||!conf){ err.textContent='All fields are required.'; return; }

      err.textContent = e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'
        ? 'Current password is incorrect.' : e.message;
    }
  };

    const lost = l.filter(x=>x.stage==='Lost').length;
    const open = l.filter(x=>!['Closed','Lost'].includes(x.stage)).length;
    const val  = l.filter(x=>x.stage==='Closed').reduce((s,x)=>s+(Number(x.dealValue)||0),0);
    const rate = l.length ? Math.round(won/l.length*100) : 0;

              <td>${esc(u.name)}</td>

      </div>`;
    })()}
  `;

  // Button events
  ct.querySelector('#btn-add-team')?.addEventListener('click', () => showAddTeamModal(teams, tls));
  ct.querySelector('#btn-add-tl')?.addEventListener('click',   () => showAddUserModal('team_lead', teams, users));
  ct.querySelector('#btn-add-ag')?.addEventListener('click',   () => showAddUserModal('agent', teams, users));
  ct.querySelector('#btn-seed')?.addEventListener('click',     () => seedLeads());

  ct.querySelectorAll('[data-edit-team]').forEach(b => b.addEventListener('click', () => showEditTeamModal(b.dataset.editTeam, teams, tls, ags)));
  ct.querySelectorAll('[data-del-team]').forEach(b  => b.addEventListener('click', () => {
    const t = teamById[b.dataset.delTeam];
    confirmModal(`Delete "${t?.name}"?`,
      'Members will become unassigned. Leads are not deleted.',
      async () => {
        const ms = await getDocs(query(collection(db,'users'), where('teamId','==',b.dataset.delTeam)));
        const bat = writeBatch(db);
        ms.docs.forEach(d => {
          const fields = {teamId:null};
          if(d.data().role==='agent') fields.tlId = null;
          bat.update(doc(db,'users',d.id), fields);
        });
        bat.delete(doc(db,'teams',b.dataset.delTeam));
        await bat.commit();
        closeModal(); toast('Team deleted.','info'); renderOrgTab();
      });
  }));
  ct.querySelectorAll('[data-perf-team]').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById(`perf-team-${b.dataset.perfTeam}`);
    if(!el) return;
    const open = el.style.display !== 'none';
    el.style.display = open ? 'none' : '';
    b.textContent = open ? '📊 Stats' : '▲ Hide Stats';
  }));
  ct.querySelectorAll('[data-perf-user]').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById(`perf-user-${b.dataset.perfUser}`);
    if(!el) return;
    const open = el.style.display !== 'none';
    el.style.display = open ? 'none' : '';
    b.textContent = open ? '📊' : '▲';
  }));
  ct.querySelectorAll('[data-edit-user]').forEach(b => b.addEventListener('click', () => showEditUserModal(b.dataset.editUser, users, teams)));
  ct.querySelectorAll('[data-del-user]').forEach(b  => b.addEventListener('click', () => {
    const u = byId[b.dataset.delUser];
    confirmModal(`Remove "${u?.name}"?`,
      'Their leads will remain but become unassigned from this member. Their login will be deactivated.',
      async () => {
        const delId = b.dataset.delUser;
        await updateDoc(doc(db,'users',delId),{active:false,teamId:null,tlId:null,lastEditedBy:CP.name,lastEditedAt:now()});
        if(u?.tlId){
          const sibs = users.filter(x=>x.role==='agent'&&x.tlId===u.tlId&&x.active!==false&&x.id!==delId);
          const newAuto = sibs.reduce((s,x)=>s+(Number(x.monthlyTarget)||0),0);
          await updateDoc(doc(db,'users',u.tlId),{autoTarget:newAuto});
        }
        // Unassign their leads so they don't silently vanish from team pipeline views
        const orphSnap = await getDocs(query(collection(db,'leads'),where('assignedTo','==',delId)));
        if(!orphSnap.empty){
          const bat2 = writeBatch(db);
          orphSnap.docs.forEach(ld => {
            bat2.update(ld.ref, {
              assignedTo:'', tlId:'',
              lastEditedBy:CP.name, lastEditedAt:now(),
              history:[...(ld.data().history||[]), { ts:now(), actorId:CU.uid, actorName:CP.name, change:`Unassigned — ${u?.name||'member'} removed from team` }]
            });
          });
          await bat2.commit();
        }
        closeModal(); toast('Member removed.','info'); renderOrgTab();
      });
  }));
}

// ── TL target helpers ────────────────────────────────────────────────────────

function calculateTLTarget(tlId, users){
  if(!tlId) return 0;
  return users
    .filter(u => u.role === 'agent' && u.tlId === tlId && u.active !== false)
    .reduce((sum, u) => sum + (Number(u.monthlyTarget) || 0), 0);
}

function showEditUserModal(userId, users, teams){
  const u    = users.find(x=>x.id===userId); if(!u) return;
  const isAg = u.role==='agent';
  const isTL = u.role==='team_lead';

  // Model B: TL target is sum of agents where agent.tlId === tl.id
  const freshAuto  = isTL ? calculateTLTarget(u.id, users) : 0;
  const initTLs    = isAg ? users.filter(x=>x.role==='team_lead'&&x.teamId===u.teamId&&x.active!==false) : [];

  modal(`Edit: ${esc(u.name)}`, `
    <div class="row2">
      <div class="field"><label>Full Name</label><input type="text" id="eu-name" value="${esc(u.name)}"></div>
      <div class="field"><label>Email</label><input type="email" id="eu-email" value="${esc(u.email)}" disabled><p class="hint">Email cannot be changed after creation.</p></div>
    </div>
    <div class="field"><label>Team</label>
      <select id="eu-team"><option value="">— Unassigned —</option>
        ${teams.map(t=>`<option value="${t.id}" ${t.id===u.teamId?'selected':''}>${esc(t.name)}</option>`).join('')}
      </select>
    </div>
    ${isAg ? `
    <div class="field"><label>Monthly Revenue Target (AED)</label><input type="number" id="eu-target" value="${u.monthlyTarget||0}"></div>
    <div class="field" id="eu-tl-wrap" ${!u.teamId?'style="display:none"':''}>
      <label>Team Lead <span class="text-dim">(optional)</span></label>
      <select id="eu-tl">
        <option value="">— Unassigned —</option>
        ${initTLs.map(tl=>`<option value="${tl.id}" ${tl.id===u.tlId?'selected':''}>${esc(tl.name)}</option>`).join('')}
      </select>
    </div>` : ''}
    ${isTL ? `
    <div class="field">
      <label>Auto Target <span class="text-dim">(sum of assigned agents)</span></label>
      <input type="number" id="eu-auto-target" value="${freshAuto}" disabled style="opacity:0.5;cursor:not-allowed">
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;margin-bottom:4px">
      <input type="checkbox" id="eu-override-chk" ${u.targetSource==='override'?'checked':''} style="width:auto;margin:0;cursor:pointer">
      <label for="eu-override-chk" style="margin:0;cursor:pointer;font-size:13px">Override target manually</label>
    </div>
    <div class="field" id="eu-override-field" style="${u.targetSource!=='override'?'display:none':''}">
      <label>Override Amount (AED)</label>
      <input type="number" id="eu-override-val" value="${u.targetSource==='override'?(u.monthlyTarget||0):freshAuto}" placeholder="e.g. 150000">
    </div>` : ''}
    <p id="eu-err" class="err"></p>
    <div class="flex gap-8 mt-12">
      <button class="btn btn-primary" id="eu-save">Save Changes</button>
      <button class="btn btn-ghost btn-sm" id="eu-reset">Send Password Reset Email</button>
    </div>
    <p class="text-dim text-xs mt-8">Last edited by ${u.lastEditedBy||'—'} · ${u.lastEditedAt ? fmtDate(u.lastEditedAt) : '—'}</p>`);

  // Wire override checkbox → show/hide override amount field
  if(isTL){
    document.getElementById('eu-override-chk').onchange = function(){
      document.getElementById('eu-override-field').style.display = this.checked ? '' : 'none';
    };
  }

  // Agent: repopulate TL dropdown when team changes
  if(isAg){
    document.getElementById('eu-team').onchange = function(){
      const tid    = this.value;
      const tlSel  = document.getElementById('eu-tl');
      const tlWrap = document.getElementById('eu-tl-wrap');
      if(!tid){ tlWrap.style.display='none'; tlSel.innerHTML='<option value="">— Unassigned —</option>'; return; }
      const teamTLs = users.filter(x=>x.role==='team_lead'&&x.teamId===tid&&x.active!==false);
      tlSel.innerHTML = '<option value="">— Unassigned —</option>' +
        teamTLs.map(tl=>`<option value="${tl.id}">${esc(tl.name)}</option>`).join('');
      tlWrap.style.display = '';
    };
  }

  document.getElementById('eu-save').onclick = async () => {
    const name   = v('eu-name'), teamId = v('eu-team');
    const err    = document.getElementById('eu-err');
    if(!name){ err.textContent='Name is required.'; return; }

    if(isTL && document.getElementById('eu-override-chk').checked && v('eu-override-val')===''){
      err.textContent='Please enter an override amount.'; return;
    }

    disable('eu-save','Saving…');
    try {
      const upd = {name, teamId:teamId||null, lastEditedBy:CP.name, lastEditedAt:now()};

      if(isAg){
        const newTlId      = v('eu-tl')||null;
        upd.monthlyTarget  = Number(v('eu-target'))||0;
        upd.targetSource   = 'manager';
        upd.tlId           = newTlId;
      }

      if(isTL){
        // Model B: TL's agents are those where agent.tlId === tl.id — team move doesn't change this
        const newAutoTarget = calculateTLTarget(u.id, users);
        const overrideChk   = document.getElementById('eu-override-chk').checked;
        const overrideVal   = Number(v('eu-override-val'))||0;
        upd.autoTarget    = newAutoTarget;
        upd.targetSource  = overrideChk ? 'override' : 'auto';
        upd.monthlyTarget = overrideChk ? overrideVal : newAutoTarget;
      }

      const bat = writeBatch(db);
      bat.update(doc(db,'users',userId), upd);

      // Agent saved → cascade autoTarget to old TL and new TL
      if(isAg){
        const oldTlId  = u.tlId||null;
        const newTlId  = upd.tlId;
        const affected = new Set([oldTlId, newTlId].filter(Boolean));
        for(const tlIdAffected of affected){
          const tl = users.find(x => x.id===tlIdAffected && x.active!==false);
          if(!tl) continue;
          // Recompute from snapshot: exclude this agent, add back with new target on new TL
          const tlAuto = users
            .filter(x => x.role==='agent' && x.tlId===tlIdAffected && x.id!==userId && x.active!==false)
            .reduce((s,x) => s + (Number(x.monthlyTarget)||0), 0)
            + (tlIdAffected===newTlId ? (Number(upd.monthlyTarget)||0) : 0);
          const tlUpd = {autoTarget:tlAuto, lastEditedBy:CP.name, lastEditedAt:now()};
          if(tl.targetSource !== 'override') tlUpd.monthlyTarget = tlAuto;
          bat.update(doc(db,'users',tl.id), tlUpd);
        }
      }

      await bat.commit();
      closeModal(); toast('Profile updated.'); renderOrgTab();
    } catch(e){ err.textContent=e.message; enable('eu-save','Save Changes'); }
  };

  document.getElementById('eu-reset').onclick = async () => {
    try {
      await sendPasswordResetEmail(auth, u.email);
      document.getElementById('eu-err').style.color = 'var(--green)';
      document.getElementById('eu-err').textContent = `Reset email sent to ${u.email}. Only works if that email inbox is accessible.`;
    } catch(e){ document.getElementById('eu-err').textContent = e.message; }
  };
}

    await bat.commit();
    toast(`✅ 115 leads imported — 58 to Agent 1, 57 to Agent 2.`);

  } catch(e){
    toast('Error: '+e.message,'err');
    if(btn){ btn.disabled=false; btn.textContent='📥 Import Leads'; }
  }
}

// DASHBOARD TAB
// ════════════════════════════════════════════════════
async function renderDashboardTab(){
  const ct = document.getElementById('content');
  const role = CP.role;

  // Fetch all data in parallel
  let leads = [], agentUsers = [], byId = {}, teamName = '';

  const leadsP = (async () => {
    if(role === 'manager'){
      const s = await getDocs(collection(db,'leads'));
      s.forEach(d => leads.push({id:d.id,...d.data()}));
    } else if(role === 'team_lead'){
      const s = await getDocs(query(collection(db,'leads'), where('teamId','==',CP.teamId)));
      s.forEach(d => leads.push({id:d.id,...d.data()}));
    } else {
      const s = await getDocs(query(collection(db,'leads'), where('assignedTo','==',CU.uid)));
      s.forEach(d => leads.push({id:d.id,...d.data()}));
    }
  })();

  const allUsersP = (async () => {
    const s = await getDocs(collection(db,'users'));
    s.forEach(d => { byId[d.id] = {id:d.id,...d.data()}; });
  })();

  const agentUsersP = role !== 'agent' ? (async () => {
    const q = role === 'manager'
      ? query(collection(db,'users'), where('role','==','agent'))
      : query(collection(db,'users'), where('tlId','==',CU.uid));
    const s = await getDocs(q);
    s.forEach(d => agentUsers.push({id:d.id,...d.data()}));
  })() : Promise.resolve();

  const teamP = role === 'team_lead' && CP.teamId ? (async () => {
    const s = await getDoc(doc(db,'teams',CP.teamId));
    if(s.exists()) teamName = s.data().name || '';
  })() : Promise.resolve();

  await Promise.all([leadsP, allUsersP, agentUsersP, teamP]);

  // KPI computations (all-time)
  const closedL   = leads.filter(l => l.stage === 'Closed');
  const lostL     = leads.filter(l => l.stage === 'Lost');
  const openL     = leads.filter(l => !['Closed','Lost'].includes(l.stage));
  const closedVal = closedL.reduce((s,l) => s + (Number(l.dealValue)||0), 0);
  const winRate   = leads.length ? Math.round(closedL.length / leads.length * 100) : 0;

  // Target — manager = sum of all agent targets
  const target = role === 'agent'     ? Number(CP.monthlyTarget)||0
               : role === 'team_lead' ? Number(CP.autoTarget||CP.monthlyTarget)||0
               : agentUsers.reduce((s,u) => s + (Number(u.monthlyTarget)||0), 0);

  // Helper: detect when a lead was closed from its history[]
  function closeMonthKey(l){
    const hist = (l.history||[]).filter(h => h.change && h.change.includes('→ Closed'));
    const ts = hist.length ? hist[hist.length-1].ts : (l.stage==='Closed' ? (l.lastEditedAt||l.createdAt) : null);
    if(!ts) return null;
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  // Current-month progress
  const nowD = new Date();
  const curKey = `${nowD.getFullYear()}-${String(nowD.getMonth()+1).padStart(2,'0')}`;
  const curClosed = closedL.filter(l => closeMonthKey(l) === curKey);
  const curVal    = curClosed.reduce((s,l) => s + (Number(l.dealValue)||0), 0);
  const prog      = target ? Math.min(Math.round(curVal / target * 100), 100) : 0;
  const progColor = prog >= 100 ? 'var(--green)' : prog >= 50 ? 'var(--amber)' : 'var(--red)';
  const targetLbl = role === 'manager' ? 'Total across all agents'
                  : role === 'team_lead' ? (CP.targetSource==='override' ? 'Manager-set target' : 'Sum of agent targets')
                  : 'Your monthly target';

  // Monthly history — last 6 months newest-first
  const months = [];
  for(let i = 0; i < 6; i++){
    const d = new Date(nowD.getFullYear(), nowD.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const lbl = d.toLocaleDateString('en-AE', {month:'short', year:'numeric'});
    months.push({key, lbl, count:0, val:0});
  }
  const mIdx = Object.fromEntries(months.map(m => [m.key, m]));
  closedL.forEach(l => { const k = closeMonthKey(l); if(k && mIdx[k]){ mIdx[k].count++; mIdx[k].val += Number(l.dealValue)||0; } });

  const monthRows = months.map(m => {
    const att = target ? Math.round(m.val / target * 100) : 0;
    const ac  = att >= 100 ? 'var(--green)' : att >= 50 ? 'var(--amber)' : m.val > 0 ? 'var(--red)' : 'var(--t2)';
    const cur = m.key === curKey;
    return `<tr ${cur ? 'style="background:rgba(124,58,237,.08)"' : ''}>
      <td style="font-weight:${cur?'600':'400'}">${esc(m.lbl)}${cur ? ' <span style="font-size:10px;color:var(--purple2)">(current)</span>' : ''}</td>
      <td>${target ? `AED ${Number(target).toLocaleString()}` : '—'}</td>
      <td>${m.count}</td>
      <td style="color:${m.val?'var(--green)':'var(--t2)'}">${m.val ? `AED ${Number(m.val).toLocaleString()}` : '—'}</td>
      <td style="color:${ac}">${target && m.val ? `${att}%` : '—'}</td>
    </tr>`;
  }).join('');

  // Follow-up buckets (open leads only)
  const todayDate = new Date(); todayDate.setHours(0,0,0,0);
  const todayStr  = todayDate.toISOString().slice(0,10);
  const endWeek   = new Date(todayDate); endWeek.setDate(todayDate.getDate() + (6 - todayDate.getDay()));
  const endWeekStr = endWeek.toISOString().slice(0,10);
  const withFu  = leads.filter(l => l.followup && !['Closed','Lost'].includes(l.stage));
  const fuOver  = withFu.filter(l => l.followup < todayStr).sort((a,b) => a.followup.localeCompare(b.followup));
  const fuToday = withFu.filter(l => l.followup === todayStr);
  const fuWeek  = withFu.filter(l => l.followup > todayStr && l.followup <= endWeekStr).sort((a,b) => a.followup.localeCompare(b.followup));

  // Activity log — flatten history[], sort desc, cap 50
  const acts = [];
  leads.forEach(l => (l.history||[]).forEach(h => acts.push({...h, company:l.company, leadId:l.id})));
  acts.sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
  const recentActs = acts.slice(0,50);

  // Agent performance rows (progress column = this month's attainment)
  const agentRows = role === 'agent' ? '' : agentUsers.map(u => {
    const ul    = leads.filter(l => l.assignedTo === u.id);
    const uw    = ul.filter(l => l.stage === 'Closed');
    const ulst  = ul.filter(l => l.stage === 'Lost');
    const uOpen = ul.filter(l => !['Closed','Lost'].includes(l.stage));
    const uRate = ul.length ? Math.round(uw.length / ul.length * 100) : 0;
    const ut    = Number(u.monthlyTarget)||0;
    const uCurVal = uw.filter(l => closeMonthKey(l) === curKey).reduce((s,l) => s + (Number(l.dealValue)||0), 0);
    const up    = ut ? Math.min(Math.round(uCurVal / ut * 100), 100) : 0;
    const upc   = up >= 100 ? 'var(--green)' : up >= 50 ? 'var(--amber)' : 'var(--red)';
    return `<tr>
      <td>${esc(u.name)}</td>
      <td>${ul.length}</td>
      <td>${uOpen.length}</td>
      <td style="color:var(--green)">${uw.length}</td>
      <td style="color:var(--red)">${ulst.length}</td>
      <td style="color:var(--amber)">${uRate}%</td>
      <td>${ut ? `AED ${Number(ut).toLocaleString()}` : '—'}</td>
      <td style="min-width:130px">${ut ? `<div style="font-size:11px;margin-bottom:3px">${up}% · AED ${Number(uCurVal).toLocaleString()}</div><div class="prog-bar-wrap"><div class="prog-bar" style="width:${up}%;background:${upc}"></div></div>` : '—'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--t2)">No agents found</td></tr>`;

  function fuTable(arr){
    if(!arr.length) return `<p style="color:var(--t2);font-size:13px;margin:4px 0 10px">None</p>`;
    return `<table class="data-table" style="margin-bottom:10px"><thead><tr><th>Company</th><th>Contact</th><th>Date</th><th>Stage</th></tr></thead>
      <tbody>${arr.map(l=>`<tr class="fu-row" data-lid="${l.id}"><td>${esc(l.company)}</td><td>${esc(l.contact||'')}</td><td>${esc(l.followup)}</td><td>${stagePill(l.stage)}</td></tr>`).join('')}</tbody></table>`;
  }

  ct.innerHTML = `<div style="padding:24px;max-width:1100px">
    <h2 style="font-size:1.25rem;font-weight:700;margin:0 0 4px">📊 Dashboard</h2>
    ${role==='team_lead'&&teamName ? `<p style="font-size:13px;color:var(--t2);margin:0 0 18px">Team: <strong style="color:var(--t1)">${esc(teamName)}</strong></p>` : '<div style="margin-bottom:18px"></div>'}

    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${leads.length}</div><div class="kpi-lbl">Total Leads</div></div>
      <div class="kpi-card"><div class="kpi-val">${openL.length}</div><div class="kpi-lbl">Open</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--green)">${closedL.length}</div><div class="kpi-lbl">Closed</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--red)">${lostL.length}</div><div class="kpi-lbl">Lost</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--amber)">${winRate}%</div><div class="kpi-lbl">Win Rate</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--green);font-size:1.15rem">AED ${Number(closedVal).toLocaleString()}</div><div class="kpi-lbl">Closed Value</div></div>
      ${role==='team_lead' ? `<div class="kpi-card"><div class="kpi-val">${agentUsers.length}</div><div class="kpi-lbl">Agents</div></div>` : ''}
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-weight:600;font-size:14px">This Month's Target</span>
        <span style="font-size:13px;color:var(--t2)">${target ? `${prog}% &nbsp;·&nbsp; AED ${Number(curVal).toLocaleString()} / AED ${Number(target).toLocaleString()}` : 'No target set'}</span>
      </div>
      ${target ? `<div class="prog-bar-wrap"><div class="prog-bar" style="width:${prog}%;background:${progColor}"></div></div>` : ''}
      <div class="stat-target">${targetLbl} · closed deals in current calendar month</div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">📈 Monthly Performance History</div>
      <div style="overflow-x:auto"><table class="data-table">
        <thead><tr><th>Month</th><th>Target</th><th>Closed Deals</th><th>Closed Value</th><th>Attainment</th></tr></thead>
        <tbody>${monthRows}</tbody>
      </table></div>
      <div style="font-size:11px;color:var(--t2);margin-top:8px">Target shown is the current setting${role==='manager'?' (sum of all agents)':''}. Historical targets are not stored.</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="section-card">
        <div style="font-weight:700;font-size:14px;margin-bottom:10px">📅 Follow-ups</div>
        ${fuOver.length ? `<div class="fu-group-hdr fu-hdr-overdue">⚠ Overdue (${fuOver.length})</div>${fuTable(fuOver)}` : ''}
        <div class="fu-group-hdr fu-hdr-today">Today (${fuToday.length})</div>${fuTable(fuToday)}
        <div class="fu-group-hdr">This Week (${fuWeek.length})</div>${fuTable(fuWeek)}
      </div>
      <div class="section-card" style="overflow:hidden">
        <div style="font-weight:700;font-size:14px;margin-bottom:10px">🕐 Recent Activity</div>
        ${recentActs.length ? `<div class="act-log">${recentActs.map(a=>`<div class="act-item">
          <div class="act-dot"></div>
          <div class="act-content">
            <div><span class="act-who">${esc(a.actorName||'')}</span> <span class="act-change">${esc(a.change||'')}</span> <span class="act-company">· ${esc(a.company||'')}</span></div>
            <div class="act-time">${fmtDate(a.ts)}</div>
          </div>
        </div>`).join('')}</div>` : `<p style="color:var(--t2);font-size:13px">No activity yet.</p>`}
      </div>
    </div>

    ${role !== 'agent' ? `<div class="section-card">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">👥 Agent Performance</div>
      <div style="overflow-x:auto"><table class="data-table">
        <thead><tr><th>Agent</th><th>Total</th><th>Open</th><th style="color:var(--green)">Closed</th><th style="color:var(--red)">Lost</th><th>Win Rate</th><th>Target</th><th>This Month</th></tr></thead>
        <tbody>${agentRows}</tbody>
      </table></div>
    </div>` : ''}
  </div>`;

  ct.querySelectorAll('.fu-row').forEach(row => {
    const lead = leads.find(l => l.id === row.dataset.lid);
    if(lead) row.addEventListener('click', () => showLeadModal(lead, byId, agentUsers));
  });
}

// PIPELINE TAB
// ════════════════════════════════════════════════════
async function renderPipelineTab(){
  const ct   = document.getElementById('content');
  const role = CP.role;

  // Load users
  const uSnap  = await getDocs(collection(db,'users'));
  const byId   = {}; uSnap.docs.forEach(d=>byId[d.id]={id:d.id,...d.data()});

  // Load leads scoped by role
  let leads = [];
  if(role==='manager'){
    leads = (await getDocs(collection(db,'leads'))).docs.map(d=>({id:d.id,...d.data()}));
  } else if(role==='team_lead'){
    if(!CP.teamId){ ct.innerHTML=`<div class="empty mt-16"><div class="empty-icon">👥</div><div class="empty-title">Not assigned to a team</div><div class="empty-sub">Contact your manager.</div></div>`; return; }
    const agSnap = await getDocs(query(collection(db,'users'),where('teamId','==',CP.teamId),where('role','==','agent')));
    const agIds  = agSnap.docs.map(d=>d.id);
    if(agIds.length>0){
      leads = (await getDocs(query(collection(db,'leads'),where('assignedTo','in',agIds)))).docs.map(d=>({id:d.id,...d.data()}));
    }
  } else {
    leads = (await getDocs(query(collection(db,'leads'),where('assignedTo','==',CU.uid)))).docs.map(d=>({id:d.id,...d.data()}));
  }

  // Available agents for assignment dropdown — TL scoped to own sub-group only (Model B)
  let agents = [];
  if(role==='manager')   agents = Object.values(byId).filter(u=>u.role==='agent'&&u.active!==false);
  if(role==='team_lead') agents = Object.values(byId).filter(u=>u.role==='agent'&&u.tlId===CU.uid&&u.active!==false);

  // Filter option lists
  let teamsForFilter = [];
  if(role==='manager'){
    const tSnap = await getDocs(collection(db,'teams'));
    teamsForFilter = tSnap.docs.map(d=>({id:d.id,...d.data()}));
  }
  const tlsForFilter    = role==='manager' ? Object.values(byId).filter(u=>u.role==='team_lead'&&u.active!==false) : [];
  const agentsForFilter = agents;

  let stageF='', searchF='';
  let teamFs=[], tlFs=[], agentFs=[];

  function filtered(){
    let r = leads;
    if(stageF)       r = r.filter(l=>l.stage===stageF);
    if(searchF){ const q=searchF.toLowerCase(); r=r.filter(l=>(l.company||'').toLowerCase().includes(q)||(l.contact||'').toLowerCase().includes(q)||(l.email||'').toLowerCase().includes(q)||(l.phone||'').includes(q)); }
    if(teamFs.length)  r = r.filter(l=>teamFs.includes(l.teamId));
    if(tlFs.length)    r = r.filter(l=>tlFs.includes(l.tlId));
    if(agentFs.length) r = r.filter(l=>agentFs.includes(l.assignedTo));
    return r;
  }

  const sCounts = {}; STAGES.forEach(s=>sCounts[s]=leads.filter(l=>l.stage===s).length);

  ct.innerHTML = `
    <div class="pg-hdr">
      <div>
        <h2>${role==='manager'?'All Leads':role==='team_lead'?'Team Pipeline':'My Leads'}</h2>
        <p class="pg-hdr-sub" id="lead-cnt">${leads.length} leads</p>
      </div>
      <div class="pg-actions">
        <input type="text" id="srch" class="search-input" placeholder="Search company, contact…">
        <button class="btn btn-primary btn-sm" id="btn-add-lead">+ Add Lead</button>
      </div>
    </div>
    ${role!=='agent' ? `<div class="adv-filters" id="adv-filters">
      <span class="adv-filters-lbl">Filter by</span>
      ${role==='manager' ? buildMsFilter('ms-tm','Team',teamsForFilter) : ''}
      ${role==='manager' ? buildMsFilter('ms-tl','TL',tlsForFilter) : ''}
      ${agentsForFilter.length ? buildMsFilter('ms-ag','Agent',agentsForFilter) : ''}
    </div>` : ''}
    <div class="filters" id="filters">
      <button class="filter-btn active" data-s="">All <span class="filter-count">${leads.length}</span></button>
      ${STAGES.map(s=>`<button class="filter-btn" data-s="${s}">${s} <span class="filter-count">${sCounts[s]}</span></button>`).join('')}
    </div>
    <div id="lead-list"></div>`;

  function renderList(){
    const f = filtered();
    document.getElementById('lead-cnt').textContent = `${f.length} lead${f.length!==1?'s':''}`;
    const el = document.getElementById('lead-list');
    if(!f.length){ el.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No leads found</div><div class="empty-sub">Try adjusting your search or filter.</div></div>`; return; }
    el.innerHTML = `<div class="tbl-wrap"><table>
      <thead><tr><th>Company</th><th>Contact</th><th>Phone</th>${role!=='agent'?'<th>Agent</th>':''}
        <th>Stage</th><th>City</th><th>Follow-up</th><th>Updated</th><th></th></tr></thead>
      <tbody>
        ${f.map(l=>`<tr>
          <td class="td-company">${esc(l.company||'—')}${l.assignedTo===CU.uid?'<span style="font-size:10px;font-weight:700;background:rgba(16,185,129,.2);color:#34d399;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle">📌 Mine</span>':''}</td>
          <td class="td-dim">${esc(l.contact||'—')}</td>
          <td class="td-dim">${l.phone?`<a href="tel:${l.phone}">${l.phone}</a>`:'—'}</td>
          ${role!=='agent'?`<td class="td-dim">${esc(byId[l.assignedTo]?.name||'—')}</td>`:''}
          <td>${stagePill(l.stage)}</td>
          <td class="td-dim">${esc(l.city||'—')}</td>
          <td class="td-dim text-sm">${l.followup||'—'}</td>
          <td class="td-dim text-sm">${l.lastEditedAt?fmtDate(l.lastEditedAt):'—'}</td>
          <td><button class="btn btn-ghost btn-xs" data-lid="${l.id}">View →</button></td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
    el.querySelectorAll('[data-lid]').forEach(b=>b.addEventListener('click',()=>{
      const lead = leads.find(x=>x.id===b.dataset.lid);
      if(lead) showLeadModal(lead, byId, agents);
    }));
  }

  renderList();

  ct.getElementById = id => ct.querySelector('#'+id); // scoped
  document.getElementById('srch').addEventListener('input', e=>{ searchF=e.target.value; renderList(); });
  document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
    stageF=b.dataset.s;
    document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('active',x===b));
    renderList();
  }));
  document.getElementById('btn-add-lead').addEventListener('click',()=>showAddLeadModal(agents, byId));
  wireMsFilter('ms-tm', teamFs,  renderList);
  wireMsFilter('ms-tl', tlFs,    renderList);
  wireMsFilter('ms-ag', agentFs, renderList);
}

// ─── LEAD MODAL ───
function showLeadModal(lead, byId, agents){
  const role      = CP.role;
  const isLocked  = lead.ownerLocked;
  const ownLead   = lead.createdBy === CU.uid;
  const canDelete = role==='manager'
    || (role==='team_lead' && !isLocked && lead.teamId===CP.teamId)
    || (role==='agent'     && !isLocked && ownLead);
  const showAssign = role==='manager' || role==='team_lead';

  modal(`${esc(lead.company||'Lead')}`, `
    <div class="info-grid mb-12">
      <div class="info-item"><div class="lbl">Contact</div><div class="val">${esc(lead.contact||'—')}</div></div>
      <div class="info-item"><div class="lbl">Company</div><div class="val"><strong>${esc(lead.company||'—')}</strong></div></div>
      <div class="info-item"><div class="lbl">Phone</div><div class="val">${lead.phone?`<a href="tel:${lead.phone}">${lead.phone}</a>`:'—'}</div></div>
      <div class="info-item"><div class="lbl">Email</div><div class="val">${lead.email?`<a href="mailto:${lead.email}">${lead.email}</a>`:'—'}</div></div>
      <div class="info-item"><div class="lbl">Industry</div><div class="val">${esc(lead.industry||'—')}</div></div>
      <div class="info-item"><div class="lbl">City</div><div class="val">${esc(lead.city||'—')}</div></div>
    </div>
    ${showAssign ? `<div class="field mb-12"><label>Assigned To</label><select id="ls-assign">${!lead.assignedTo?`<option value="" selected>— Unassigned —</option>`:''}${agents.map(a=>`<option value="${a.id}"${a.id===lead.assignedTo?' selected':''}>${esc(a.name)}</option>`).join('')}${lead.assignedTo&&!agents.find(a=>a.id===lead.assignedTo)&&byId[lead.assignedTo]?`<option value="${lead.assignedTo}" selected>${esc(byId[lead.assignedTo].name)} (current)</option>`:''}</select></div>` : `<div class="info-item mb-12"><div class="lbl">Assigned To</div><div class="val">${esc(byId[lead.assignedTo]?.name||'— Unassigned —')}</div></div>`}
    <div class="divider"></div>
    <div class="row2">
      <div class="field"><label>Stage</label>
        <select id="ls-stage">${STAGES.map(s=>`<option value="${s}"${s===lead.stage?' selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Follow-up Date</label><input type="date" id="ls-fu" value="${lead.followup||''}"></div>
    </div>
    <div id="ls-dv-wrap" style="${lead.stage==='Closed'?'':'display:none'}">
      <div class="field"><label>Deal Value (AED)</label><input type="number" id="ls-dv" value="${lead.dealValue||0}" placeholder="0"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="ls-notes" rows="3">${esc(lead.notes||'')}</textarea></div>
    ${isLocked && role!=='manager' ? `<div class="locked-note">⚠ Manager-created lead. Stage, notes and follow-up are editable. Reassignment and deletion are manager-only.</div>` : ''}
    <p class="text-dim text-xs mt-8">Last edited by <strong>${esc(lead.lastEditedBy||'—')}</strong> · ${lead.lastEditedAt?fmtDate(lead.lastEditedAt):'—'}</p>
    <p id="lm-err" class="err"></p>
    <div class="flex gap-8 mt-12">
      <button class="btn btn-primary" id="lm-save">Save Changes</button>
      ${canDelete ? `<button class="btn btn-danger btn-sm" id="lm-del">Delete Lead</button>` : ''}
    </div>`,true);

  // Show deal value when Won
  document.getElementById('ls-stage').addEventListener('change', function(){
    document.getElementById('ls-dv-wrap').style.display = this.value==='Closed' ? '' : 'none';
  });

  document.getElementById('lm-save').onclick = async () => {
    const stage = v('ls-stage'), fu = v('ls-fu'), notes = v('ls-notes');
    const dv    = v('ls-dv') || lead.dealValue || 0;
    const newAssignTo = showAssign ? (v('ls-assign')||lead.assignedTo) : lead.assignedTo;
    disable('lm-save','Saving…');
    try {
      // Build change summary against lead snapshot
      const changes = [];
      if(stage !== lead.stage)                     changes.push(`Stage: ${lead.stage} → ${stage}`);
      if(newAssignTo !== lead.assignedTo)          changes.push(`Assigned: ${byId[lead.assignedTo]?.name||'—'} → ${byId[newAssignTo]?.name||newAssignTo}`);
      if(notes !== (lead.notes||''))               changes.push('Notes updated');
      if(fu !== (lead.followup||''))               changes.push(`Follow-up: ${fu||'cleared'}`);
      if(Number(dv) !== Number(lead.dealValue||0)) changes.push(`Deal value: AED ${Number(dv).toLocaleString()}`);
      const changeSummary = changes.length ? changes.join('; ') : 'No changes';

      // Build update payload
      const update = {
        stage, followup:fu, notes, dealValue:Number(dv),
        assignedTo:newAssignTo,
        lastEditedBy:CP.name, lastEditedAt:now(),
        history:[...(lead.history||[]), { ts:now(), actorId:CU.uid, actorName:CP.name, change:changeSummary }]
      };

      // Re-resolve teamId only if assignee changed
      if(newAssignTo !== lead.assignedTo){
        const aSnap = await getDoc(doc(db,'users',newAssignTo));
        update.teamId = aSnap.exists() ? (aSnap.data().teamId||'') : '';
        update.tlId   = aSnap.exists() ? (aSnap.data().tlId  ||'') : '';
      }

      await updateDoc(doc(db,'leads',lead.id), update);
      closeModal(); toast('Lead saved.'); renderPipelineTab();
    } catch(e){ document.getElementById('lm-err').textContent=e.message; enable('lm-save','Save Changes'); }
  };

  document.getElementById('lm-del')?.addEventListener('click',()=>{
    // Runtime guards — enforce delete rules at point of action
    if(role==='team_lead' && (lead.ownerLocked || lead.teamId!==CP.teamId)){
      toast('You can only delete unowned leads within your own team.','err'); return;
    }
    if(role==='agent' && (lead.ownerLocked || lead.createdBy!==CU.uid)){
      toast('You can only delete leads you created.','err'); return;
    }
    confirmModal(`Delete lead for ${esc(lead.company)}?`,
      'This cannot be undone.',
      async () => {
        await deleteDoc(doc(db,'leads',lead.id));
        closeModal(); toast('Lead deleted.','info'); renderPipelineTab();
      });
  });
}

      ${role!=='agent' ? `<div class="field"><label>Assign To</label>
        <select id="nl-ag">
          ${role==='manager' ? `<option value="${CU.uid}">— Me (Manager) —</option>` : ''}
          ${agents.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}

async function seedChannels(){
  const snap = await getDocs(collection(db,'channels'));
  if(snap.size > 0) return;
  const defaults = ['WhatsApp','LinkedIn','Email','Cold Call'];
  const bat = writeBatch(db);
  defaults.forEach(name => {
    bat.set(doc(collection(db,'channels')),{name,createdBy:CU.uid,createdAt:now(),active:true});
  });
  await bat.commit();
}

function chClass(name){
  const n=(name||'').toLowerCase();
  if(n==='whatsapp') return 'sc-ch-wa';
  if(n==='linkedin') return 'sc-ch-li';
  if(n==='email')    return 'sc-ch-em';
  if(n.includes('cold')) return 'sc-ch-cc';
  return 'sc-ch-def';
}

async function renderScriptsSection(){
  const ct   = document.getElementById('content');
  const role = CP.role;
  ct.innerHTML = '<div class="loading"><div class="spin"></div> Loading…</div>';

  if(role==='manager') await seedChannels();

  const [chSnap, scSnap] = await Promise.all([
    getDocs(query(collection(db,'channels'),where('active','==',true))),
    getDocs(collection(db,'scripts'))
  ]);
  const channels   = chSnap.docs.map(d=>({id:d.id,...d.data()}));
  const allScripts = scSnap.docs.map(d=>({id:d.id,...d.data()}));

  // Visibility rules:
  // Manager  → all scripts
  // TL       → global (manager-created) + own team scripts
  // Agent    → approved global + approved scripts whose createdBy === agent's tlId
  let scripts;
  if(role==='manager'){
    scripts = allScripts;
  } else if(role==='team_lead'){
    scripts = allScripts.filter(s =>
      s.scope==='global' || (s.scope==='team' && s.createdBy===CU.uid)
    );
  } else {
    scripts = allScripts.filter(s =>
      (s.scope==='global' && s.approved) ||
      (s.scope==='team'   && s.approved && s.createdBy===CP.tlId)
    );
  }

  let chFilter = '';

  // ── inner: filter ───────────────────────────────
  function filteredScripts(){ return chFilter ? scripts.filter(s=>s.channel===chFilter) : scripts; }

  // ── inner: re-render approval queue (manager only) ──
  function renderQueueBlock(){
    const qEl = document.getElementById('sc-queue');
    if(!qEl) return;
    const pending = scripts.filter(s=>s.pendingApproval);
    if(!pending.length){ qEl.innerHTML=''; return; }
    qEl.innerHTML=`<div class="approval-queue">
      <div class="approval-queue-hdr">
        <span style="font-weight:600;color:#93c5fd">🔔 Pending Approvals (${pending.length})</span>
      </div>
      ${pending.map(s=>`<div class="approval-item">
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px">${esc(s.title)}</div>
          <div class="sc-meta" style="margin-top:2px">Submitted by <strong>${esc(s.pendingApproval.submittedByName||'—')}</strong> · ${s.pendingApproval.submittedAt?fmtDate(s.pendingApproval.submittedAt):'—'}</div>
        </div>
        <button class="btn btn-primary btn-xs" data-sc-qreview="${s.id}">Review →</button>
      </div>`).join('')}
    </div>`;
    qEl.querySelectorAll('[data-sc-qreview]').forEach(b=>{
      const s=scripts.find(x=>x.id===b.dataset.scQreview);
      if(s) b.addEventListener('click',()=>showApprovalModal(s,onScriptUpdate));
    });
  }

  // ── inner: mutation callback ─────────────────────
  function onScriptUpdate(updated){
    if(updated){
      const idx=scripts.findIndex(x=>x.id===updated.id);
      if(idx>=0) scripts[idx]=updated; else scripts.push(updated);
    }
    renderQueueBlock();
    renderCards();
  }

  // ── inner: render script cards ───────────────────
  function renderCards(){
    const list = document.getElementById('sc-list');
    if(!list) return;
    const cntEl = document.getElementById('sc-count');
    if(cntEl) cntEl.textContent = `${scripts.length} script${scripts.length!==1?'s':''}`;
    const f = filteredScripts();
    if(!f.length){
      list.innerHTML=`<div class="empty"><div class="empty-icon">📞</div>
        <div class="empty-title">No scripts yet</div>
        <div class="empty-sub">${role==='agent'?'Your team has no scripts yet.':'Add your first script to get started.'}</div></div>`;
      return;
    }

    list.innerHTML=`<div class="sc-grid">${f.map(s=>{
      const isPendingMine = role==='team_lead' && !!s.pendingApproval && s.pendingApproval.submittedBy===CU.uid;
      const hasPending    = role==='manager'   && !!s.pendingApproval;
      const cls = isPendingMine?'sc-card pending-mine':hasPending?'sc-card has-pending':'sc-card';
      const displayBody   = isPendingMine ? (s.pendingApproval.proposedBody||'') : (s.body||'');
      const bId = `scb-${s.id}`;
      return `<div class="${cls}">
        <div class="flex gap-8" style="flex-wrap:wrap">
          <span class="sc-badge ${chClass(s.channel)}">${esc(s.channel||'—')}</span>
          <span class="sc-badge ${s.scope==='global'?'sc-scope-global':'sc-scope-team'}">${s.scope==='global'?'🌐 Global':'👥 Team'}</span>
          ${isPendingMine?'<span class="sc-pending-badge">⏳ Awaiting Approval</span>':''}
          ${hasPending?'<span class="sc-pending-badge" style="color:#93c5fd;background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3)">🔔 Edit Pending</span>':''}
        </div>
        <div style="font-weight:600;font-size:.95rem">${esc(s.title)}</div>
        ${isPendingMine?'<div class="sc-meta" style="color:#f59e0b">📝 Showing your proposed edit — pending manager approval</div>':''}
        <div class="sc-body" id="${bId}">${esc(displayBody)}</div>
        <button class="btn btn-ghost btn-xs sc-expand" style="align-self:flex-start;padding:2px 6px;font-size:11px;margin-top:-4px" data-bid="${bId}">Show more ▼</button>
        <div class="sc-meta">
          Created by <strong>${esc(s.createdByName||'—')}</strong> · ${s.createdAt?fmtDate(s.createdAt):'—'}
          ${s.lastEditedBy&&s.lastEditedAt&&s.lastEditedBy!==s.createdByName
            ?`<br>Edited by <strong>${esc(s.lastEditedBy)}</strong> · ${fmtDate(s.lastEditedAt)}`:''}
        </div>
        <div class="sc-actions">
          ${role==='manager'?`
            <button class="btn btn-ghost btn-xs" data-sc-edit="${s.id}">✏ Edit</button>
            ${hasPending?`<button class="btn btn-primary btn-xs" data-sc-review="${s.id}">🔔 Review</button>`:''}
            <button class="btn btn-danger btn-xs" data-sc-del="${s.id}">Delete</button>
          `:''}
          ${role==='team_lead'&&s.createdBy===CU.uid?`
            <button class="btn btn-ghost btn-xs" data-sc-edit="${s.id}">✏ Edit</button>
            <button class="btn btn-danger btn-xs" data-sc-del="${s.id}">Delete</button>
          `:''}
          ${role==='team_lead'&&s.createdBy!==CU.uid&&!s.pendingApproval?`
            <button class="btn btn-ghost btn-xs" data-sc-suggest="${s.id}">✏ Suggest Edit</button>
          `:''}
          ${isPendingMine?`
            <button class="btn btn-ghost btn-xs" data-sc-withdraw="${s.id}">↩ Withdraw Edit</button>
          `:''}
          ${role==='agent'?`<button class="btn btn-ghost btn-xs" data-sc-view="${s.id}">View →</button>`:''}
        </div>
      </div>`;
    }).join('')}</div>`;

    // Expand toggles — check after paint
    list.querySelectorAll('.sc-expand').forEach(b=>{
      const bodyEl = document.getElementById(b.dataset.bid);
      if(!bodyEl){ b.style.display='none'; return; }
      requestAnimationFrame(()=>{
        if(bodyEl.scrollHeight<=95){ b.style.display='none'; return; }
        b.addEventListener('click',()=>{
          const exp = bodyEl.classList.toggle('expanded');
          b.textContent = exp?'Show less ▲':'Show more ▼';
        });
      });
    });

    // Edit (direct — manager always, TL on own)
    list.querySelectorAll('[data-sc-edit]').forEach(b=>{
      const s=scripts.find(x=>x.id===b.dataset.scEdit);
      if(s) b.addEventListener('click',()=>showEditScriptModal(s,channels,onScriptUpdate));
    });

    // Delete
    list.querySelectorAll('[data-sc-del]').forEach(b=>{
      const sid=b.dataset.scDel;
      const s=scripts.find(x=>x.id===sid);
      if(!s) return;
      b.addEventListener('click',()=>confirmModal(`Delete "${esc(s.title)}"?`,'Cannot be undone.',async()=>{
        await deleteDoc(doc(db,'scripts',sid));
        scripts.splice(scripts.findIndex(x=>x.id===sid),1);
        closeModal(); toast('Script deleted.','info');
        renderQueueBlock(); renderCards();
      }));
    });

    // Suggest edit (TL on manager scripts)
    list.querySelectorAll('[data-sc-suggest]').forEach(b=>{
      const s=scripts.find(x=>x.id===b.dataset.scSuggest);
      if(s) b.addEventListener('click',()=>showSuggestEditModal(s,onScriptUpdate));
    });

    // Withdraw proposed edit
    list.querySelectorAll('[data-sc-withdraw]').forEach(b=>{
      const sid=b.dataset.scWithdraw;
      const s=scripts.find(x=>x.id===sid);
      if(!s) return;
      b.addEventListener('click',()=>confirmModal(
        'Withdraw proposed edit?',
        'Your suggested changes will be discarded. The original script is unchanged.',
        async()=>{
          await updateDoc(doc(db,'scripts',sid),{pendingApproval:null});
          s.pendingApproval=null;
          closeModal(); toast('Edit withdrawn.'); renderCards();
        }
      ));
    });

    // View (agent)
    list.querySelectorAll('[data-sc-view]').forEach(b=>{
      const s=scripts.find(x=>x.id===b.dataset.scView);
      if(s) b.addEventListener('click',()=>showScriptViewModal(s));
    });

    // In-card review (manager)
    list.querySelectorAll('[data-sc-review]').forEach(b=>{
      const s=scripts.find(x=>x.id===b.dataset.scReview);
      if(s) b.addEventListener('click',()=>showApprovalModal(s,onScriptUpdate));
    });
  }

  // ── Build page shell ─────────────────────────────
  ct.innerHTML=`
    <div class="pg-hdr">
      <div><h2>📞 Scripts</h2><p class="pg-hdr-sub" id="sc-count">${scripts.length} script${scripts.length!==1?'s':''}</p></div>
      <div class="pg-actions">
        ${role!=='agent'?`<button class="btn btn-primary btn-sm" id="btn-add-sc">+ New Script</button>`:''}
        ${role==='manager'?`<button class="btn btn-ghost btn-sm" id="btn-ch-mgr">⚙ Channels</button>`:''}
      </div>
    </div>
    ${role==='manager'?'<div id="sc-queue"></div>':''}
    <div class="filters" id="sc-ch-filters">
      <button class="ch-tag active" data-ch="">All</button>
      ${channels.map(ch=>`<button class="ch-tag" data-ch="${esc(ch.name)}">${esc(ch.name)}</button>`).join('')}
    </div>
    <div id="sc-list"></div>`;

  if(role==='manager') renderQueueBlock();
  renderCards();

  ct.querySelector('#btn-add-sc')?.addEventListener('click',()=>showAddScriptModal(channels,scripts,onScriptUpdate));
  ct.querySelector('#btn-ch-mgr')?.addEventListener('click',()=>showManageChannelsModal(channels,renderScriptsSection));
  ct.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>{
    chFilter=b.dataset.ch;
    ct.querySelectorAll('[data-ch]').forEach(x=>x.classList.toggle('active',x===b));
    renderCards();
  }));
}

function showAddScriptModal(channels, scripts, onUpdate){
  const isManager = CP.role==='manager';
  modal('New Script',`
    <div class="field"><label>Title *</label><input type="text" id="ns-title" placeholder="e.g. Opening WhatsApp message"></div>

      closeModal(); toast('Script created.');
      onUpdate({id:ref.id,...payload});
    }catch(e){err.textContent=e.message; enable('ns-btn','Create Script');}
  };
}

// ── MANAGE CHANNELS (manager) ────────────────────────
function showManageChannelsModal(channels, refreshFn){
  function renderChList(){
    const el = document.getElementById('ch-list');
    if(!el) return;
    el.innerHTML = channels.length
      ? channels.map(ch=>`<div class="flex gap-8 mb-12" style="align-items:center">
          <span style="flex:1;font-size:13px">${esc(ch.name)}</span>
          <button class="btn btn-danger btn-xs" data-del-ch="${ch.id}">Remove</button>
        </div>`).join('')
      : '<p class="text-dim text-xs">No channels.</p>';
    el.querySelectorAll('[data-del-ch]').forEach(b=>{
      const chId=b.dataset.delCh;
      b.addEventListener('click',async()=>{
        if(!confirm('Remove this channel? Existing scripts keep their channel label.')) return;
        await updateDoc(doc(db,'channels',chId),{active:false});
        channels.splice(channels.findIndex(x=>x.id===chId),1);
        renderChList();
      });
    });
  }

  modal('Manage Channels',`
    <div id="ch-list"></div>
    <div class="divider"></div>
    <div class="field"><label>Add New Channel</label><input type="text" id="ch-new" placeholder="e.g. SMS, In-Person"></div>
    <p id="ch-err" class="err"></p>
    <button class="btn btn-primary btn-sm" id="ch-add-btn">+ Add Channel</button>
    <p class="text-dim text-xs mt-12">Changes apply next time the Scripts tab is opened.</p>`);

  renderChList();

  document.getElementById('ch-add-btn').onclick=async()=>{
    const name=v('ch-new');
    const err=document.getElementById('ch-err');
    if(!name){err.textContent='Channel name required.'; return;}
    if(channels.find(c=>c.name.toLowerCase()===name.toLowerCase())){err.textContent='Channel already exists.'; return;}
    disable('ch-add-btn','Adding…');
    try{
      const ref=await addDoc(collection(db,'channels'),{name,createdBy:CU.uid,createdAt:now(),active:true});
      channels.push({id:ref.id,name,active:true});
      document.getElementById('ch-new').value='';
      err.textContent='';
      enable('ch-add-btn','+ Add Channel');
      renderChList();
      toast('Channel added.');
    }catch(e){err.textContent=e.message; enable('ch-add-btn','+ Add Channel');}
  };
}

// PRODUCTS — HELPERS
// ════════════════════════════════════════════════════
async function seedProducts(){
  const snap = await getDocs(collection(db,'products'));
  if(snap.size > 0) return;
  const bat = writeBatch(db);
  SEED_PRODUCTS.forEach(p => {
    bat.set(doc(collection(db,'products')), {
      ...p, monthlyWaivers:[], active:true,
      createdBy:CU.uid, createdByName:CP.name, createdAt:now(),
      lastEditedBy:CP.name, lastEditedAt:now()
    });
  });
  await bat.commit();
}

function activeDiscount(discounts, term){
  const t = now().slice(0,10);
  return (discounts||[]).find(d =>
    d.appliesToTerm===term && (!d.validFrom||d.validFrom<=t) && (!d.validTo||d.validTo>=t)
  ) || null;
}

function parseSpecs(text){
  const out = {};
  (text||'').split('\n').forEach(line=>{
    const i = line.indexOf(':');
    if(i<0) return;
    const k = line.slice(0,i).trim(), val = line.slice(i+1).trim();
    if(k) out[k] = val;
  });
  return out;
}
function specsToText(obj){
  return Object.entries(obj||{}).map(([k,val])=>`${k}: ${val}`).join('\n');
}
function prCatClass(cat){
  const c = (cat||'').toLowerCase();
  if(c==='starter')   return 'pr-cat-starter';
  if(c==='essential') return 'pr-cat-essential';
  if(c==='ultimate')  return 'pr-cat-ultimate';
  if(c==='mobile')    return 'pr-cat-mobile';
  return 'pr-cat-starter';
}

async function renderProductsSection(){
  const ct = document.getElementById('content');
  const role = CP.role;
  const isManager = role==='manager';
  ct.innerHTML = '<div class="loading"><div class="spin"></div> Loading…</div>';

  if(isManager) await seedProducts();

  const snap = await getDocs(query(collection(db,'products'),where('active','==',true)));
  let products = snap.docs.map(d=>({id:d.id,...d.data()}));

  const categories = ['Starter','Essential','Ultimate','Mobile'];
  let catFilter = '';

  function filtered(){ return catFilter ? products.filter(p=>p.category===catFilter) : products; }

  function onProductUpdate(updated){
    const idx = products.findIndex(x=>x.id===updated.id);
    if(idx>=0) products[idx]=updated; else products.push(updated);
    renderCards();
  }

  function renderCards(){
    const list = document.getElementById('pr-list');
    if(!list) return;
    const cntEl = document.getElementById('pr-count');
    if(cntEl) cntEl.textContent = `${products.length} product${products.length!==1?'s':''}`;
    const f = filtered();
    if(!f.length){
      list.innerHTML = `<div class="empty"><div class="empty-icon">📦</div>
        <div class="empty-title">No products yet</div>
        <div class="empty-sub">${isManager?'Add your first product to get started.':'Check back soon.'}</div></div>`;
      return;
    }
    list.innerHTML = `<div class="pr-grid">${f.map(p=>{
      const opts = p.pricingOptions||[];
      const priceRows = opts.map(po=>{
        const disc = activeDiscount(p.discounts, po.term);
        return `<div class="pr-price-row">
          <span class="pr-price-term">${esc(po.label)}:</span>
          ${disc
            ? `<span class="pr-price-orig">AED ${po.price}</span><span class="pr-price-now">AED ${disc.price}</span>${disc.percentage?`<span class="text-dim text-xs">(${disc.percentage}% off)</span>`:''}`
            : `<span class="pr-price-now">AED ${po.price}</span>`}
        </div>`;
      }).join('');
      const specEntries = Object.entries(p.specs||{}).slice(0,6);
      const specsHtml = specEntries.length
        ? `<div class="info-grid mt-12">${specEntries.map(([k,val])=>
            `<div class="info-item"><div class="lbl">${esc(k)}</div><div class="val">${esc(val)}</div></div>`).join('')}</div>`
        : '';
      const discCount = (p.discounts||[]).length;
      const wvCount   = (p.monthlyWaivers||[]).length;
      return `<div class="pr-card">
        <div class="flex gap-8" style="flex-wrap:wrap;justify-content:space-between">
          <span class="pr-cat ${prCatClass(p.category)}">${esc(p.category)}</span>
          <div class="flex gap-8">
            ${discCount?`<span class="pr-sub-badge pr-sub-discount">${discCount} discount${discCount!==1?'s':''}</span>`:''}
            ${wvCount?`<span class="pr-sub-badge pr-sub-waiver">${wvCount} waiver${wvCount!==1?'s':''}</span>`:''}
          </div>
        </div>
        <div style="font-weight:600;font-size:.95rem">${esc(p.name)}</div>
        ${priceRows}
        <p class="text-dim text-xs">Activation: AED ${p.activationFee||0}</p>
        ${specsHtml}
        ${p.notes?`<p class="text-dim text-xs mt-8">${esc(p.notes)}</p>`:''}
        ${isManager?`
          <div class="sc-actions">
            <button class="btn btn-ghost btn-xs" data-pr-edit="${p.id}">✏ Edit</button>
            <button class="btn btn-ghost btn-xs" data-pr-disc="${p.id}">% Discounts</button>
            <button class="btn btn-ghost btn-xs" data-pr-wv="${p.id}">💰 Waivers</button>
            <button class="btn btn-danger btn-xs" data-pr-del="${p.id}">Delete</button>
          </div>`:''}
      </div>`;
    }).join('')}</div>`;

    list.querySelectorAll('[data-pr-edit]').forEach(b=>{
      const p = products.find(x=>x.id===b.dataset.prEdit);
      if(p) b.addEventListener('click',()=>showEditProductModal(p,onProductUpdate));
    });
    list.querySelectorAll('[data-pr-disc]').forEach(b=>{
      const p = products.find(x=>x.id===b.dataset.prDisc);
      if(p) b.addEventListener('click',()=>showManageDiscountsModal(p,onProductUpdate));
    });
    list.querySelectorAll('[data-pr-wv]').forEach(b=>{
      const p = products.find(x=>x.id===b.dataset.prWv);
      if(p) b.addEventListener('click',()=>showManageWaiversModal(p,onProductUpdate));
    });
    list.querySelectorAll('[data-pr-del]').forEach(b=>{
      const pid = b.dataset.prDel;
      const p = products.find(x=>x.id===pid);
      if(!p) return;
      b.addEventListener('click',()=>confirmModal(`Delete "${esc(p.name)}"?`,'Cannot be undone.',async()=>{
        await deleteDoc(doc(db,'products',pid));
        products = products.filter(x=>x.id!==pid);
        closeModal(); toast('Product deleted.','info');
        renderCards();
      }));
    });
  }

  ct.innerHTML = `
    <div class="pg-hdr">
      <div><h2>📦 Products & Pricing</h2><p class="pg-hdr-sub" id="pr-count">${products.length} product${products.length!==1?'s':''}</p></div>
      <div class="pg-actions">
        ${isManager?`<button class="btn btn-primary btn-sm" id="btn-add-pr">+ New Product</button>`:''}
      </div>
    </div>
    <div class="filters" id="pr-cat-filters">
      <button class="ch-tag active" data-cat="">All</button>
      ${categories.map(c=>`<button class="ch-tag" data-cat="${c}">${c}</button>`).join('')}
    </div>
    <div id="pr-list"></div>`;

  renderCards();

  ct.querySelector('#btn-add-pr')?.addEventListener('click',()=>showAddProductModal(onProductUpdate));
  ct.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
    catFilter = b.dataset.cat;
    ct.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));
    renderCards();
  }));
}
